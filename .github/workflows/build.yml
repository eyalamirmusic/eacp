name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal Binary
            os: macos-latest
            cmake-flags: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - name: Linux GCC
            os: ubuntu-latest
            cmake-flags: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++'
          - name: Linux Clang
            os: ubuntu-latest
            cmake-flags: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'
          # The Linux graphics backend: Wayland windows and the Vulkan
          # backend, built against the Wayland development packages and run
          # on Mesa's lavapipe under a headless Weston session. The two lanes
          # above keep proving that the option off still builds.
          - name: Linux Clang Graphics
            os: ubuntu-latest
            vulkan: true
            cmake-flags: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DEACP_LINUX_GRAPHICS=ON'
          - name: Windows MSVC
            os: windows-latest
            msvc-arch: x64
            cmake-flags: ''
          - name: Windows Clang
            os: windows-latest
            msvc-arch: x64
            cmake-flags: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'
          - name: Windows MSVC ARM64
            os: windows-11-arm
            msvc-arch: arm64
            cmake-flags: ''
          - name: Windows Clang ARM64
            os: windows-11-arm
            msvc-arch: arm64
            cmake-flags: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Only the graphics lane sets these; every other entry has no `vulkan` key,
    # so the expression yields an empty string, which reads as unset everywhere
    # these are checked. EACP_HEADLESS keeps windows off a runner with no
    # session, EACP_REQUIRE_GPU makes DevicePresenceTests fail rather than let
    # the whole GPU suite self-skip into a silent green, and EACP_VK_SOFTWARE
    # picks the CPU device, which on a runner is the only one there is.
    env:
      EACP_HEADLESS: ${{ matrix.vulkan && '1' || '' }}
      EACP_REQUIRE_GPU: ${{ matrix.vulkan && '1' || '' }}
      EACP_VK_SOFTWARE: ${{ matrix.vulkan && '1' || '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev clang

      # The loader and Mesa's software rasterizer - nothing links either: volk
      # opens libvulkan.so.1 by name at runtime, so those are runtime
      # dependencies of the lane rather than build dependencies of the project.
      # The Wayland half is different: libwayland-client, xkbcommon and libdecor
      # are linked, wayland-scanner generates the protocol bindings at build
      # time, and Weston is the compositor the tests open their windows on.
      - name: Install the Linux graphics dependencies
        if: matrix.vulkan
        run: >
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          libwayland-dev wayland-protocols libwayland-bin libxkbcommon-dev
          libdecor-0-dev pkg-config weston

      # Before the build, not before the test. NanoTest discovers cases by
      # running every test binary with --list-tests at build time, so a lane
      # whose ICD never arrived fails at `cmake --build` with nothing useful to
      # say; this is the step that says it. VK_DRIVER_FILES is deliberately not
      # set - the lavapipe manifest is named per architecture
      # (lvp_icd.x86_64.json here, lvp_icd.json on an arm64 image), and the
      # loader finds it from the ICD directory without being told.
      - name: Show the Vulkan device
        if: matrix.vulkan
        run: vulkaninfo --summary

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2
        with:
          arch: ${{ matrix.msvc-arch }}

      # No target uses C++20 modules; the scan pass is dead weight. Remove
      # this flag if modules are ever adopted.
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DEACP_CI_BUILD=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF ${{ matrix.cmake-flags }}

      - name: Build
        run: cmake --build build

      - name: Test
        if: ${{ !matrix.vulkan }}
        run: ctest --test-dir build --output-on-failure -j 4

      # Inside a headless Weston session, with headless mode off so windows
      # really open: the Wayland window tests and the swapchain present tests
      # run for real, and EACP_REQUIRE_DISPLAY turns their self-skip into a
      # failure so a lane whose compositor never came up cannot report green.
      # The build above still ran headless, which is what NanoTest's build-time
      # test discovery wants.
      - name: Test under Weston
        if: matrix.vulkan
        env:
          EACP_HEADLESS: '0'
          EACP_REQUIRE_DISPLAY: '1'
        run: Scripts/with-weston ctest --test-dir build --output-on-failure -j 4

  build-ios:
    name: iOS Simulator
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -G Xcode -B build
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DEACP_CI_BUILD=ON

      - name: Build
        run: cmake --build build --config Debug -- -sdk iphonesimulator
