name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal Binary
            os: macos-latest
            cache-key: macos-universal
            cmake-flags: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - name: Linux GCC
            os: ubuntu-latest
            cache-key: linux-gcc
            cmake-flags: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++'
          - name: Linux Clang
            os: ubuntu-latest
            cache-key: linux-clang
            cmake-flags: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'
          # Every Linux lane builds the Wayland/Vulkan/FreeType backend; this
          # is the one that also runs it, on Mesa's lavapipe inside a headless
          # Weston session. The two lanes above have no ICD and no compositor,
          # so their GPU and window tests self-skip.
          - name: Linux Clang Vulkan
            os: ubuntu-latest
            cache-key: linux-clang
            vulkan: true
            cmake-flags: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'
          - name: Windows MSVC
            os: windows-latest
            cache-key: windows-msvc-x64
            msvc-arch: x64
            cmake-flags: ''
          - name: Windows Clang
            os: windows-latest
            cache-key: windows-clang-x64
            msvc-arch: x64
            cmake-flags: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'
          - name: Windows MSVC ARM64
            os: windows-11-arm
            cache-key: windows-msvc-arm64
            msvc-arch: arm64
            cmake-flags: ''
          - name: Windows Clang ARM64
            os: windows-11-arm
            cache-key: windows-clang-arm64
            msvc-arch: arm64
            cmake-flags: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # An expression that yields an empty string reads as unset everywhere these
    # are checked, so each of these is on exactly for the lanes named in it.
    # Every Linux lane: EACP_HEADLESS keeps windows off a runner with no
    # session, and EACP_REQUIRE_FONTS makes the font tests fail rather than
    # self-skip - they need a rasterizer and font files, not a device, so every
    # lane can carry them. Only the lane with a device: EACP_REQUIRE_GPU makes
    # DevicePresenceTests fail rather than let the whole GPU suite self-skip
    # into a silent green, and EACP_VK_SOFTWARE picks the CPU device, which on
    # a runner is the only one there is.
    #
    # CCACHE_DEPEND: ccache hashes the source and the include files the
    # compiler's own dependency output names (-MD, /showIncludes) instead of
    # running the preprocessor a second time, so a miss costs the compile and
    # nothing more. What it gives up - a hit after a change the preprocessor
    # would have erased - never happens on a runner.
    env:
      CCACHE_DEPEND: '1'
      EACP_HEADLESS: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
      EACP_REQUIRE_FONTS: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
      EACP_REQUIRE_GPU: ${{ matrix.vulkan && '1' || '' }}
      EACP_VK_SOFTWARE: ${{ matrix.vulkan && '1' || '' }}

    steps:
      - uses: actions/checkout@v6

      # A ccache per compiler and architecture, kept in the Actions cache (the
      # two Linux Clang lanes compile identical objects and share one). A
      # translation unit whose preprocessed text, compiler and flags match an
      # earlier run is restored rather than compiled: every third-party object
      # on every run, and most of eacp's own on a change inside one module.
      # The eviction keeps each saved cache to what this build touched, so
      # eight lanes at 1 GB apiece stay inside the repository's 10 GB. The
      # Windows x64 image carries Strawberry Perl's ccache 4.9.1 on PATH, which
      # the default detection would take; the binary install is ccache's own
      # current release on every Windows lane instead.
      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.cache-key }}
          max-size: 1G
          evict-old-files: job
          install: ${{ runner.os == 'Windows' && 'binary' || 'detect' }}

      # Everything a Linux build links or generates code with, on every Linux
      # lane: libwayland-client, xkbcommon and libdecor are linked and
      # wayland-scanner generates the protocol bindings at build time, and
      # FreeType, HarfBuzz and fontconfig are linked by the glyph rasterizer.
      # The font packages beside them are not optional either: every font test
      # asks fontconfig for a family by name and self-skips when it cannot
      # resolve one, so a runner with no fonts installed runs the whole Text
      # suite as a silent green. DejaVu is the stock family the defaults name
      # (fonts-dejavu-extra carries the ExtraLight and Condensed faces the
      # weight and width matching needs), Droid Sans Fallback is the CJK
      # fallback a missing glyph lands on, and Noto Color Emoji is the one
      # colour font in the set.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev clang \
            libwayland-dev wayland-protocols libwayland-bin libxkbcommon-dev \
            libdecor-0-dev pkg-config \
            libxcb1-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libxcb-icccm4-dev libxcb-xinput-dev libxcb-xtest0-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev \
            fonts-dejavu-core fonts-dejavu-extra fonts-noto-color-emoji \
            fonts-droid-fallback

      # What the one lane that runs the backend needs on top, and none of it is
      # a build dependency: nothing links the loader or Mesa's software
      # rasterizer - volk opens libvulkan.so.1 by name at runtime - Weston is
      # the compositor the Wayland tests open their windows on, and Xvfb the X
      # server the X11 ones do.
      - name: Install the Vulkan runtime, a compositor and an X server
        if: matrix.vulkan
        run: >
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          weston xvfb

      # Before the build, not before the test. NanoTest discovers cases by
      # running every test binary with --list-tests at build time, so a lane
      # whose ICD never arrived fails at `cmake --build` with nothing useful to
      # say; this is the step that says it. VK_DRIVER_FILES is deliberately not
      # set - the lavapipe manifest is named per architecture
      # (lvp_icd.x86_64.json here, lvp_icd.json on an arm64 image), and the
      # loader finds it from the ICD directory without being told.
      - name: Show the Vulkan device
        if: matrix.vulkan
        run: vulkaninfo --summary

      # The same reasoning one step up, for the other half that fails by
      # skipping. What fontconfig resolves the two default families to, and
      # what families it has at all: a substitution here is what a font test
      # asserting on a face name will report as a mismatch, and an empty list
      # is what it will report as a skip.
      - name: Show the fonts
        if: runner.os == 'Linux'
        run: |
          fc-match monospace
          fc-match sans-serif
          fc-list : family | sort -u

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2
        with:
          arch: ${{ matrix.msvc-arch }}

      # ccache is the launcher for every language the lane compiles, which on
      # macOS includes Objective-C++. Windows embeds debug info in each object
      # (/Z7): the default /Zi writes one PDB per target that every translation
      # unit appends to, which no per-object cache can restore. EACP_CI_BUILD
      # leaves the PCH off for the same reason - ccache cannot cache MSVC's at
      # all - and a hit saves the whole compile where the image saved a third.
      # No target uses C++20 modules; the scan pass is dead weight. Remove that
      # flag if modules are ever adopted.
      - name: Configure
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEACP_CI_BUILD=ON
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ runner.os == 'macOS' && '-DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache' || '' }}
          ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}
          ${{ matrix.cmake-flags }}

      - name: Build
        run: cmake --build build

      - name: Test
        if: ${{ !matrix.vulkan }}
        run: ctest --test-dir build --output-on-failure -j 4

      # A test binary that crashes on macOS logs only its signal; the stack is
      # in the report ReportCrash writes, so a failed lane keeps those.
      - name: Upload macOS crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-macos
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: warn

      # Inside a headless Weston session, with headless mode off so windows
      # really open: the Wayland window tests and the swapchain present tests
      # run for real, and EACP_REQUIRE_DISPLAY turns their self-skip into a
      # failure so a lane whose compositor never came up cannot report green.
      # The build above still ran headless, which is what NanoTest's build-time
      # test discovery wants. The two X11 suites are left out here: each prefers
      # X11 by its own default, and there is no X server in this session.
      - name: Test under Weston
        if: matrix.vulkan
        env:
          EACP_HEADLESS: '0'
          EACP_REQUIRE_DISPLAY: '1'
        run: >
          Scripts/with-weston ctest --test-dir build --output-on-failure -j 4
          -E '^(X11|EmbeddedView)(/|$)'

      # The same windows on the other window system: an Xvfb with no window
      # manager, which is the harshest X11 target there is, and the swapchain
      # presenting over VK_KHR_xcb_surface. Only the suites that open windows
      # run again; everything else already ran above.
      - name: Test under Xvfb
        if: matrix.vulkan
        env:
          EACP_HEADLESS: '0'
          EACP_REQUIRE_DISPLAY: '1'
        run: >
          Scripts/with-xvfb ctest --test-dir build --output-on-failure -j 4
          -R '^(X11|EmbeddedView|Present)(/|$)'

      # lavapipe is a 1.3 device; this forces the render-pass path a Vulkan 1.1
      # device takes, so both paths stay covered.
      - name: Test the GPU suite on render passes
        if: matrix.vulkan
        env:
          EACP_HEADLESS: '0'
          EACP_REQUIRE_DISPLAY: '1'
          EACP_VK_RENDER_PASSES: '1'
        run: Scripts/with-weston build/Tests/GPU/GPUTests

  build-ios:
    name: iOS Simulator
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -G Xcode -B build
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DEACP_CI_BUILD=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo -- -sdk iphonesimulator

  # The one Android build anything is checked against: the NDK it installs, the
  # toolchain file -DCMAKE_SYSTEM_NAME=Android alone selects, and HelloGPU,
  # which pulls Core, Graphics, GPU, Text and the SPIR-V compiler through the
  # NDK's clang, with HelloNetwork beside it for the JNI network backend. The
  # configure also writes the Android Studio project, so the Gradle templates
  # are exercised; nothing runs it. RelWithDebInfo, like every lane;
  # Studio's Run builds its own Debug.
  build-android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370

    steps:
      - uses: actions/checkout@v6

      # The runner's SDK carries sdkmanager and a few older NDKs, and names
      # one of them in ANDROID_NDK_HOME; the configure names the one it
      # installed, which an app locking its NDK does the same way. Ninja is
      # the generator; the resource embedder's generator is built for the host
      # with the runner's own compiler.
      - name: Install Ninja, the NDK and a platform
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35"

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_SYSTEM_NAME=Android -DEACP_ANDROID_NDK_VERSION=$NDK_VERSION -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEACP_CI_BUILD=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      # What a configure that names nothing picks: the newest NDK and the
      # newest platform in the SDK, with no NDK variable to point elsewhere.
      - name: Configure with the newest NDK and platform
        run: |
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK
          cmake -G Ninja -B build-floating -DCMAKE_SYSTEM_NAME=Android -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          grep -A2 "compileSdk" build-floating/AndroidStudio/HelloGPU/build.gradle.kts

      - name: Build
        run: cmake --build build --target HelloGPU HelloNetwork
