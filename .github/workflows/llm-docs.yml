name: LLM Docs

on:
  push:
    branches: [main, develop]

concurrency:
  group: llm-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish agent docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: Scripts/install-doxygen.sh

      - name: Generate docs
        run: |
          python3 -m pip install -r Scripts/llm-docs-requirements.txt
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            alias=stable
          else
            alias=latest
          fi
          python3 Scripts/generate-llm-docs.py --base-url "https://pond.audio/eacp/$alias"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EACP_DOCS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.EACP_DOCS_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            Scripts/publish-llm-docs.sh "${GITHUB_SHA::7}" main stable
          else
            Scripts/publish-llm-docs.sh "${GITHUB_SHA::7}" latest develop
          fi
